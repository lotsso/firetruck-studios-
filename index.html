<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statystyki</title>
</head>
<body style="font-family:monospace;background:#000;color:#eee;margin:12px">
<pre id="o">Ladowanie...</pre>
<button onclick="load()">Odswiez</button>
<script>
var o = document.getElementById("o");
try { var c = localStorage.getItem("s"); if (c) o.textContent = c + "\n\n(zapisane, odswiezam...)"; } catch (e) {}
function load() {
  fetch("/api/stats").then(function (r) { return r.text(); }).then(function (t) {
    o.textContent = t;
    try { localStorage.setItem("s", t); } catch (e) {}
  }).catch(function () { o.textContent += "\n\nBrak internetu, pokazuje ostatnie dane."; });
}
load();
</script>
</body>
</html>
