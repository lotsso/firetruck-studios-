<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel dostępu</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>

    <main class="container">

        <section class="card" id="loginCard">
            <div class="icon">🔒</div>

            <h1>Panel dostępu</h1>
            <p class="subtitle">Wprowadź kod, aby kontynuować</p>

            <form id="loginForm">
                <input
                    id="code"
                    type="password"
                    inputmode="numeric"
                    maxlength="6"
                    placeholder="Kod dostępu"
                    autocomplete="off"
                    required
                >

                <button type="submit">
                    Odblokuj
                </button>
            </form>

            <p id="error" class="error"></p>
        </section>

        <section class="card hidden" id="contentCard">
            <div class="success-icon">✓</div>

            <h1>Odblokowano</h1>

            <p id="randomText" class="random-text"></p>

            <button id="logoutButton" class="secondary">
                Wyloguj
            </button>
        </section>

    </main>

    <script>
        const form = document.getElementById("loginForm");
        const codeInput = document.getElementById("code");
        const error = document.getElementById("error");

        const loginCard = document.getElementById("loginCard");
        const contentCard = document.getElementById("contentCard");
        const randomText = document.getElementById("randomText");
        const logoutButton = document.getElementById("logoutButton");

        const texts = [
            "Witaj. Dostęp został przyznany.",
            "System działa poprawnie.",
            "Miłego korzystania ze strony.",
            "Dostęp został pomyślnie zweryfikowany.",
            "Ten tekst został wybrany losowo."
        ];

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            error.textContent = "";

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        code: codeInput.value
                    })
                });

                const data = await response.json();

                if (data.success) {
                    loginCard.classList.add("hidden");
                    contentCard.classList.remove("hidden");

                    randomText.textContent =
                        texts[Math.floor(Math.random() * texts.length)];

                    codeInput.value = "";
                } else {
                    error.textContent =
                        data.message || "Nieprawidłowy kod.";
                }

            } catch {
                error.textContent =
                    "Nie udało się połączyć z serwerem.";
            }
        });

        logoutButton.addEventListener("click", () => {
            contentCard.classList.add("hidden");
            loginCard.classList.remove("hidden");
            codeInput.value = "";
            error.textContent = "";
        });
    </script>

</body>
</html>
