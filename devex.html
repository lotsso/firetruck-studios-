<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0709">
<title>DevEx calculator – Pink Petal Studio</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="alternate icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0709; --card:#140d12; --line:#2a1a25; --text:#f6eef3; --mute:#b9a3b1; --dim:#7d6876;
  --accent:#ff6fa8; --ease:cubic-bezier(.2,.8,.2,1);
  --display:'Inter',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{font-family:var(--body);color:var(--text);background:var(--bg);line-height:1.6}
::selection{background:var(--accent);color:#000}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* NAV (as on index.html) */
nav{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 5vw;position:sticky;top:0;z-index:10;
  background:rgba(11,7,9,.8);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:-.01em;display:flex;align-items:center;gap:12px}
.logo img{width:34px;height:34px;display:block}
nav ul{display:flex;gap:32px;list-style:none;font-weight:500}
nav ul a{position:relative;color:var(--mute);transition:color .2s}
nav ul a::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:1px;background:var(--accent);
  transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
nav ul a:hover,nav ul a[aria-current]{color:var(--text)}
nav ul a:hover::after,nav ul a:focus-visible::after,nav ul a[aria-current]::after{transform:scaleX(1)}

main{padding:80px 5vw 100px;max-width:1100px;margin:auto}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,4.5vw,2.6rem);line-height:1.15;letter-spacing:-.04em;margin-bottom:8px}
h1::before{content:"";display:block;width:36px;height:3px;margin-bottom:16px;background:var(--accent)}
.lead{max-width:60ch;margin-bottom:40px;color:var(--mute)}

/* GAME PICKER (cards as on index.html) */
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,280px));gap:16px}
.gcard{position:relative;display:block;aspect-ratio:1;overflow:hidden;background:var(--card);border:1px solid var(--line);
  transition:border-color .25s,transform .25s var(--ease)}
.gcard:hover{border-color:var(--accent);transform:translateY(-3px)}
.gcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.gcard:hover img{transform:scale(1.05)}
.gcard .info{position:absolute;left:0;right:0;bottom:0;padding:44px 16px 14px;background:linear-gradient(transparent,rgba(8,5,7,.92) 45%)}
.gcard h3{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.3;letter-spacing:-.01em;margin-bottom:4px}
.gcard .meta{font-size:.82rem;color:var(--mute)}

/* CALCULATOR */
.back{display:inline-block;color:var(--mute);margin-bottom:28px;transition:color .2s}
.back:hover{color:var(--text)}
.game{display:flex;align-items:center;gap:18px}
.game img{width:64px;height:64px;flex:none;background:var(--card)}
.game img:not([src]){visibility:hidden}
.panel{background:var(--card);border:1px solid var(--line);padding:22px;margin-bottom:16px}
label{display:block;color:var(--mute);font-size:.9rem;margin-bottom:8px}
.inp{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--line);transition:border-color .2s}
.inp:focus-within{border-color:var(--accent)}
.inp input{flex:1;min-width:0;font:inherit;font-family:var(--display);font-weight:800;font-size:clamp(2rem,7vw,3rem);letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;color:var(--text);background:none;border:0;outline:0;padding:4px 0}
.inp input::placeholder{color:var(--dim)}
.inp span{font-weight:700;font-size:1.3rem;color:var(--mute)}
.total{margin-top:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.total b{color:var(--text);font-weight:600}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.person{background:var(--card);border:1px solid var(--line);padding:20px 22px}
.who{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.who b{font-family:var(--display);font-size:1.15rem;font-weight:700}
.who span{color:var(--accent);font-weight:700}
.bar{height:4px;background:var(--line);margin:12px 0 16px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .5s var(--ease)}
.rbx{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1.2;letter-spacing:-.03em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pln{color:var(--mute);font-variant-numeric:tabular-nums}
.pln b{color:var(--text);font-weight:600;font-size:1.1rem}
.note{color:var(--dim);font-size:.85rem;margin-top:18px}
.warn{color:#ff9fc2}

@media (max-width:640px){nav ul{gap:16px;font-size:.9rem}.logo span,nav .wide{display:none}main{padding-top:48px}.gl{grid-template-columns:minmax(0,340px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav>
  <a class="logo" href="index.html"><img src="logo.svg" alt="Pink Petal Studio logo"><span>Pink Petal Studio</span></a>
  <ul>
    <li><a href="index.html#games">Portfolio</a></li>
    <li><a href="devex.html" aria-current="page">DevEx<span class="wide"> calculator</span></a></li>
    <li><a href="index.html#achievements">Achievements</a></li>
  </ul>
</nav>

<main id="app"></main>

<script src="shared.js"></script>
<script>
const gid = new URLSearchParams(location.search).get('id');
const app = document.getElementById('app');
const nameOf = id => CONFIG.names?.[id] || 'Game '+id;
const splitOf = id => Object.entries(CONFIG.payouts?.[id] || {});
const pln = new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
let games = [], usdPln = CONFIG.usdPln, rateDate = null, rateFailed = false;

// "100000", "100,000", "100 000", "100k", "1.5m" -> number of Robux
function parseRobux(s){
  const m = String(s).toLowerCase().replace(/[\s,_]/g,'').match(/^(\d*\.?\d+)([km]?)$/);
  return m ? +m[1] * (m[2]==='k' ? 1e3 : m[2]==='m' ? 1e6 : 1) : null;
}

function renderPicker(){
  app.innerHTML = `<h1>DevEx calculator</h1>
    <p class="lead">Pick a game to see its revenue split and how much each person can cash out.</p>
    <div class="gl">${CONFIG.games.map(id => {
      const g = games.find(x => x.inputId === id), split = splitOf(id);
      return `<a class="gcard" href="devex.html?id=${encodeURIComponent(id)}">
        ${g?.icon ? `<img src="${esc(g.icon)}" alt="" loading="lazy">` : ''}
        <div class="info"><h3>${esc(g?.name || nameOf(id))}</h3>
        <div class="meta">${split.length ? split.map(([who,p]) => `${esc(who)} ${p}%`).join(' · ') : 'No split set yet'}</div></div>
      </a>`; }).join('')}</div>`;
}

function renderCalc(){
  const split = splitOf(gid), sum = split.reduce((a,[,p]) => a+p, 0);
  app.innerHTML = `<a class="back" href="devex.html">← All games</a>
    <div class="game"><img id="icon" alt=""><div><h1 id="gname">${esc(nameOf(gid))}</h1></div></div>
    <p class="lead">Revenue split: ${split.length ? split.map(([who,p]) => `${esc(who)} ${p}%`).join(' · ') : 'none'}</p>
    ${!split.length ? `<p class="warn">No revenue split set for this game. Add it to CONFIG.payouts in shared.js.</p>` : `
    <div class="panel">
      <label for="rbx">Robux to cash out</label>
      <div class="inp"><input id="rbx" inputmode="decimal" autocomplete="off" placeholder="100,000" aria-describedby="total"><span>R$</span></div>
      <p class="total" id="total" aria-live="polite"></p>
    </div>
    <div class="people">${split.map(([who,p], i) => `<div class="person">
      <div class="who"><b>${esc(who)}</b><span>${p}%</span></div>
      <div class="bar"><i style="width:${Math.min(100,p)}%"></i></div>
      <div class="rbx" id="r${i}">–</div><div class="pln" id="p${i}">&nbsp;</div>
    </div>`).join('')}</div>
    ${sum !== 100 ? `<p class="warn note">The split adds up to ${sum}%, not 100%.</p>` : ''}
    <p class="note" id="rate"></p>`}`;
  const inp = document.getElementById('rbx');
  if(inp){ inp.addEventListener('input', update); update(); }
  showGame();
}

function update(){
  const inp = document.getElementById('rbx'); if(!inp) return;
  const r = parseRobux(inp.value), split = splitOf(gid), usd = r * CONFIG.robuxUsd;
  document.getElementById('total').innerHTML = r == null
    ? (inp.value.trim() ? 'Enter a number, e.g. 100000 or 100k' : 'Enter the amount of Robux the game earned')
    : `= <b>${pln.format(usd)} USD</b> · <b>${pln.format(usd * usdPln)} PLN</b>`;
  split.forEach(([, p], i) => {
    const share = r == null ? null : r * p / 100;
    document.getElementById('r'+i).textContent = share == null ? '–' : nf.format(Math.floor(share))+' R$';
    document.getElementById('p'+i).innerHTML = share == null ? '&nbsp;'
      : `<b>${pln.format(share * CONFIG.robuxUsd * usdPln)} PLN</b> · ${pln.format(share * CONFIG.robuxUsd)} USD`;
  });
  document.getElementById('rate').textContent = `1 R$ = ${CONFIG.robuxUsd} USD · 1 USD = ${usdPln} PLN `+
    (rateDate ? `(NBP rate from ${new Date(rateDate).toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'})})`
             : rateFailed ? '(fixed rate, live NBP rate unavailable)' : '(loading the NBP rate…)');
}

function showGame(){        // fill in the icon and Roblox name once they load
  const g = games.find(x => x.inputId === gid); if(!g) return;
  if(g.icon) document.getElementById('icon').src = g.icon;
  document.getElementById('gname').textContent = g.name;
  document.title = g.name+' – DevEx calculator';
}

gid ? renderCalc() : renderPicker();
fetchGames().then(g => { games = g; gid ? showGame() : renderPicker(); }).catch(e => console.warn('Could not fetch games:', e));
getJSON('https://api.nbp.pl/api/exchangerates/rates/a/usd/?format=json').then(j => {
  const r = j.rates?.[0]; if(!r?.mid) return;
  usdPln = r.mid; rateDate = r.effectiveDate; update();
}).catch(e => { rateFailed = true; update(); console.warn('Could not fetch the USD/PLN rate:', e); });
</script>
</body>
</html>
