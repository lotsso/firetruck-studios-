<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0b">
<title>DevEx calculator – Pink Petal Studio</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="alternate icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
main{padding:140px 6vw 110px;max-width:1180px;margin:auto}
.head{text-align:center;margin-bottom:56px}
.head h1{font-size:clamp(2rem,6vw,4.4rem)}
.head .caps{margin-top:16px;display:block}

/* CALCULATOR */
.back{display:inline-block;margin-bottom:34px;transition:color .2s}
.back:hover{color:var(--text)}
.game{display:flex;align-items:center;gap:22px;margin-bottom:12px}
.game img{width:72px;height:72px;flex:none;background:var(--panel);object-fit:cover}
.game img:not([src]){visibility:hidden}
.game h1{font-size:clamp(1.5rem,4.2vw,2.8rem);line-height:1.05}
.split-line{margin:6px 0 40px}
.calc{padding:30px 32px;margin-bottom:18px;border-color:transparent;
  background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(140deg,rgba(255,111,168,.55),rgba(167,139,250,.3) 40%,var(--line) 75%) border-box}
label{display:block;margin-bottom:10px}
.inp{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);transition:border-color .2s}
.inp:focus-within{border-color:var(--pink)}
.inp input{flex:1;min-width:0;font:inherit;font-stretch:125%;font-weight:800;font-size:clamp(2rem,7vw,3.4rem);letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;color:var(--text);background:none;border:0;outline:0;padding:6px 0}
.inp input::placeholder{color:#2e2e33}
.inp span{font-weight:600;font-size:1.1rem;letter-spacing:.1em;color:var(--mute)}
.total{margin-top:14px;color:var(--mute);font-size:.85rem;font-variant-numeric:tabular-nums}
.total b{color:var(--text);font-weight:600}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.person{padding:24px 26px}
.who{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.who b{font-stretch:118%;font-weight:700;font-size:1rem;text-transform:uppercase;letter-spacing:.04em}
.who span{font-size:.7rem;font-weight:600;letter-spacing:.2em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{height:2px;background:var(--line);margin:14px 0 18px}
.bar i{display:block;height:100%;background:var(--grad);transition:width .5s var(--ease)}
.rbx{font-stretch:118%;font-weight:800;font-size:1.8rem;line-height:1.2;letter-spacing:-.01em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pln{margin-top:4px;color:var(--mute);font-size:.82rem;font-variant-numeric:tabular-nums}
.pln b{color:var(--text);font-weight:600;font-size:1rem}
.note{color:var(--dim);font-size:.78rem;margin-top:22px}
.warn{color:#d9a0a0}

@media (max-width:640px){main{padding-top:110px}.calc{padding:24px 20px}}
</style>
</head>
<body>
<nav class="nav" id="nav">
  <a class="mark" href="index.html"><img src="logo.svg" alt="Pink Petal Studio"></a>
  <ul>
    <li><a href="index.html#games">Projects</a></li>
    <li><a href="devex.html" aria-current="page">DevEx</a></li>
    <li><a href="index.html#achievements">Achievements</a></li>
  </ul>
</nav>

<main id="app"></main>

<script src="shared.js"></script>
<script src="fx.js"></script>
<script>
const gid = new URLSearchParams(location.search).get('id');
const app = document.getElementById('app');
const nameOf = id => CONFIG.names?.[id] || 'Game '+id;
const splitOf = id => Object.entries(CONFIG.payouts?.[id] || {});
const onRoblox = id => CONFIG.games.includes(id);   // other games only have a split (not released yet)
const pln = new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
let games = [], usdPln = CONFIG.usdPln, rateDate = null, rateFailed = false;

// "100000", "100,000", "100 000", "100k", "1.5m" -> number of Robux
function parseRobux(s){
  const m = String(s).toLowerCase().replace(/[\s,_]/g,'').match(/^(\d*\.?\d+)([km]?)$/);
  return m ? +m[1] * (m[2]==='k' ? 1e3 : m[2]==='m' ? 1e6 : 1) : null;
}

function renderPicker(){
  app.innerHTML = `<div class="head"><h1 class="wide shine">DevEx calculator</h1>
    <span class="caps">Pick a game · see its revenue split and each person's cash out</span></div>
    <div class="gl">${[...new Set([...CONFIG.games, ...Object.keys(CONFIG.payouts || {})])].map(id => {
      const g = games.find(x => x.inputId === id), split = splitOf(id);
      return `<a class="gcard" href="devex.html?id=${encodeURIComponent(id)}">
        <div class="img">${g?.icon ? `<img src="${esc(g.icon)}" alt="" loading="lazy">` : onRoblox(id) ? '' : '<div class="ph"><img src="logo-mono.svg" alt=""></div>'}</div>
        <div class="info"><h3>${esc(g?.name || nameOf(id))}</h3>
        <div class="meta">${split.length ? split.map(([who,p]) => `<span>${esc(who)} <b>${p}%</b></span>`).join('') : 'No split set yet'}</div></div>
      </a>`; }).join('')}</div>`;
}

function renderCalc(){
  const split = splitOf(gid), sum = split.reduce((a,[,p]) => a+p, 0);
  app.innerHTML = `<a class="back caps" href="devex.html">← All games</a>
    <div class="game"><img id="icon" alt=""${onRoblox(gid) ? '' : ' src="logo-mono.svg"'}><h1 class="wide shine" id="gname">${esc(nameOf(gid))}</h1></div>
    <p class="caps split-line">Revenue split · ${split.length ? split.map(([who,p]) => `${esc(who)} ${p}%`).join(' · ') : 'none'}</p>
    ${!split.length ? `<p class="warn">No revenue split set for this game. Add it to CONFIG.payouts in shared.js.</p>` : `
    <div class="panel calc">
      <label class="caps" for="rbx">Robux to cash out</label>
      <div class="inp"><input id="rbx" inputmode="decimal" autocomplete="off" placeholder="100,000" aria-describedby="total"><span>R$</span></div>
      <p class="total" id="total" aria-live="polite"></p>
    </div>
    <div class="people">${split.map(([who,p], i) => `<div class="panel person">
      <div class="who"><b>${esc(who)}</b><span>${p}%</span></div>
      <div class="bar"><i style="width:${Math.min(100,p)}%"></i></div>
      <div class="rbx" id="r${i}">–</div><div class="pln" id="p${i}">&nbsp;</div>
    </div>`).join('')}</div>
    ${sum !== 100 ? `<p class="warn note">The split adds up to ${sum}%, not 100%.</p>` : ''}
    <p class="note" id="rate"></p>`}`;
  const inp = document.getElementById('rbx');
  if(inp){ inp.addEventListener('input', update); update(); }
  showGame();
}

function update(){
  const inp = document.getElementById('rbx'); if(!inp) return;
  const r = parseRobux(inp.value), split = splitOf(gid), usd = r * CONFIG.robuxUsd;
  document.getElementById('total').innerHTML = r == null
    ? (inp.value.trim() ? 'Enter a number, e.g. 100000 or 100k' : 'Enter the amount of Robux the game earned')
    : `= <b>${pln.format(usd)} USD</b> · <b>${pln.format(usd * usdPln)} PLN</b>`;
  split.forEach(([, p], i) => {
    const share = r == null ? null : r * p / 100;
    document.getElementById('r'+i).textContent = share == null ? '–' : nf.format(Math.floor(share))+' R$';
    document.getElementById('p'+i).innerHTML = share == null ? '&nbsp;'
      : `<b>${pln.format(share * CONFIG.robuxUsd * usdPln)} PLN</b> · ${pln.format(share * CONFIG.robuxUsd)} USD`;
  });
  document.getElementById('rate').textContent = `1 R$ = ${CONFIG.robuxUsd} USD · 1 USD = ${usdPln} PLN `+
    (rateDate ? `(NBP rate from ${new Date(rateDate).toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'})})`
             : rateFailed ? '(fixed rate, live NBP rate unavailable)' : '(loading the NBP rate…)');
}

function showGame(){        // fill in the icon and Roblox name once they load
  const g = games.find(x => x.inputId === gid); if(!g) return;
  if(g.icon) document.getElementById('icon').src = g.icon;
  document.getElementById('gname').textContent = g.name;
  document.title = g.name+' – DevEx calculator';
}

gid ? renderCalc() : renderPicker();
fetchGames().then(g => { games = g; gid ? showGame() : renderPicker(); }).catch(e => console.warn('Could not fetch games:', e));
getJSON('https://api.nbp.pl/api/exchangerates/rates/a/usd/?format=json').then(j => {
  const r = j.rates?.[0]; if(!r?.mid) return;
  usdPln = r.mid; rateDate = r.effectiveDate; update();
}).catch(e => { rateFailed = true; update(); console.warn('Could not fetch the USD/PLN rate:', e); });

const nav = document.getElementById('nav');
addEventListener('scroll', () => nav.classList.toggle('solid', scrollY > 40), {passive:true});
</script>
</body>
</html>
